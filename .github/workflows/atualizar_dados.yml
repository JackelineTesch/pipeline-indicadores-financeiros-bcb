name: Atualizar Dados BACEN

on:
  schedule:
    - cron: '0 9 * * 1-5'  # segunda a sexta às 9h (horário UTC = 6h Brasil)
  workflow_dispatch:         # permite rodar manualmente pelo GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline
        run: python pipeline.py

      - name: Commit e push dos dados atualizados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/indicadores_atual.csv
          git diff --staged --quiet || git commit -m "data: atualização automática dos indicadores $(date +'%Y-%m-%d')"
          git push